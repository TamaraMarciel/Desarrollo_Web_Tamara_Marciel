{% extends "base.html" %}

{% block title %}Estadísticas - Adopta{% endblock %}

{% block header %}Estadísticas{% endblock %}

{% block content %}

<!-- Gráficos -->
<section>
    <div class="row">
        <div class="col-4 col-12-medium">
            <h2>Avisos por día</h2>
            <div id="lineal-chart" style="min-height: 400px; width: 100%;"></div>
        </div>
        
        <div class="col-4 col-12-medium">
            <h2>Tipo de mascota</h2>
            <div id="pie-chart" style="min-height: 400px; width: 100%;"></div>
        </div>
        
        <div class="col-4 col-12-medium">
            <h2>Avisos por mes</h2>
            <div id="bar-chart" style="min-height: 400px; width: 100%;"></div>
        </div>
    </div>
</section>

<hr>

<!-- Botones para volver -->
<section>
    <div class="row">
        <div class="col-6 col-12-medium">
            <ul class="actions stacked">
                <li><a href="{{ url_for('index') }}" class="button primary fit">Volver a Portada</a></li>
            </ul>
        </div>
        <div class="col-6 col-12-medium">
            <ul class="actions stacked">
                <li><a href="{{ url_for('listar_avisos') }}" class="button fit">Ver Avisos</a></li>
            </ul>
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<!--Cargar Highcharts desde CDN -->
<script src="https://code.highcharts.com/highcharts.js"></script>

<!-- Cargar script DESPUÉS de que Highcharts esté listo -->
<script>
//Highcharts ya está disponible
function loadEstadisticasScript() {
    if (typeof Highcharts === 'undefined') {
        console.log('Esperando a Highcharts...');
        setTimeout(loadEstadisticasScript, 50);
        return;
    }
    
    console.log('✓ Highcharts cargado, ahora cargando estadisticas.js');
    
    // Crear y cargar el script de estadísticas
    var script = document.createElement('script');
    script.src = "{{ url_for('static', filename='js/estadisticas.js') }}";
    script.onload = function() {
        console.log('✓ estadisticas.js cargado exitosamente');
    };
    script.onerror = function() {
        console.error('✗ Error al cargar estadisticas.js');
        console.error('Verifica que el archivo existe en: static/js/estadisticas.js');
    };
    document.body.appendChild(script);
}

// Iniciar la carga
loadEstadisticasScript();
</script>
{% endblock %}
