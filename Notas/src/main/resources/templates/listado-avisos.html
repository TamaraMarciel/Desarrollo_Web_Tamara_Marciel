<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Avisos de Adopción</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/extra.css}">
    <noscript><link rel="stylesheet" th:href="@{/css/noscript.css}"></noscript>
</head>
<body class="is-preload">

<div id="wrapper">

    <header id="header">
        <h1>Evaluación de Avisos de Adopción</h1>
        <p>Sistema de calificación de mascotas en adopción</p>
    </header>

    <div id="main">

        <section id="content" class="main">
            <h2>Listado de Avisos</h2>

            <div class="table-wrapper">
                <table class="alt" id="tabla-avisos">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha publicación</th>
                        <th>Sector</th>
                        <th>Cantidad</th>
                        <th>Tipo</th>
                        <th>Edad</th>
                        <th>Comuna</th>
                        <th>Nota</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="aviso : ${avisos}">
                        <td th:text="${aviso.id}">1</td>
                        <td th:text="${#strings.substring(aviso.fechaPublicacion, 0, 10)}">2025-06-02</td>
                        <td th:text="${aviso.sector}">Beauchef 859</td>
                        <td th:text="${aviso.cantidad}">1</td>
                        <td th:text="${aviso.tipo}">gato</td>
                        <td th:text="${aviso.edad}">2 meses</td>
                        <td th:text="${aviso.comuna}">Santiago</td>
                        <td class="nota-cell" th:id="'nota-' + ${aviso.id}" th:text="${aviso.nota}">-</td>
                        <td>
                            <button class="button small primary"
                                    th:attr="data-aviso-id=${aviso.id}"
                                    onclick="evaluarAviso(this)">
                                Evaluar
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

</div>

<div id="modal-evaluacion" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <h2>Evaluar Aviso</h2>
        <p id="modal-mensaje">Selecciona una nota del 1 al 7 para este aviso:</p>
        <div class="notas-container">
            <button class="button primary small" onclick="seleccionarNota(1)">1</button>
            <button class="button primary small" onclick="seleccionarNota(2)">2</button>
            <button class="button primary small" onclick="seleccionarNota(3)">3</button>
            <button class="button primary small" onclick="seleccionarNota(4)">4</button>
            <button class="button primary small" onclick="seleccionarNota(5)">5</button>
            <button class="button primary small" onclick="seleccionarNota(6)">6</button>
            <button class="button primary small" onclick="seleccionarNota(7)">7</button>
        </div>
        <div id="mensaje-respuesta" class="mensaje"></div>
    </div>
</div>

<script th:src="@{/js/evaluacion.js}"></script>

</body>
</html>
